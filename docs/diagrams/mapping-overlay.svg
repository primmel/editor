<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="monospace">
  <!-- The mapper: REF left, IMP right, overlay edges between, coverage tints -->
  <defs>
    <style>
      .pane { fill: #252019; stroke: #3a322a; stroke-width: 1.5; rx: 8; }
      .title { fill: #e9e0d2; font-size: 14px; font-weight: bold; }
      .label { fill: #8a8f98; font-size: 11px; }
      .small { fill: #8a8f98; font-size: 10px; }
      .accent { fill: #d49442; }
      .node { fill: none; stroke-width: 2; rx: 8; }
      .edge { stroke: #d49442; stroke-width: 2; fill: none; opacity: 0.6; }
      .edgeH { stroke: #d49442; stroke-width: 3; fill: none; }
    </style>
    <filter id="glowG"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7a9e5e"/></filter>
    <filter id="glowA"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#d49442"/></filter>
    <filter id="glowR"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#b85555"/></filter>
    <filter id="glowS"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8a8f98"/></filter>
  </defs>
  <rect width="960" height="560" fill="#1c1814"/>
  <text class="title" x="30" y="40">The mapper — one pair, both panes, the coverage overlay</text>

  <!-- REF pane -->
  <rect class="pane" x="30" y="66" width="360" height="380"/>
  <text class="label accent" x="46" y="92">REFERENCE — the standard</text>
  <rect class="node" x="70" y="120" width="110" height="46" stroke="#d49442" filter="url(#glowG)"/>
  <text class="small" x="86" y="147">MakeGood</text>
  <text class="small sage" x="70" y="178">tint: full (green)</text>
  <rect class="node" x="70" y="220" width="110" height="46" stroke="#d49442" filter="url(#glowA)"/>
  <text class="small" x="82" y="247">CheckGood</text>
  <text class="small accent" x="70" y="278">tint: partial (amber)</text>
  <rect class="node" x="70" y="320" width="110" height="46" stroke="#d49442" filter="url(#glowR)"/>
  <text class="small" x="78" y="347">GuardSecrets</text>
  <text class="small" x="70" y="378" fill="#b85555">conflict: asserted ≠ computed</text>

  <!-- IMP pane -->
  <rect class="pane" x="570" y="66" width="360" height="380"/>
  <text class="label accent" x="586" y="92">IMPLEMENTATION — your model</text>
  <rect class="node" x="740" y="120" width="110" height="46" stroke="#d49442" filter="url(#glowG)"/>
  <text class="small" x="756" y="147">Produce</text>
  <text class="small sage" x="740" y="178">mapped</text>
  <rect class="node" x="740" y="220" width="110" height="46" stroke="#d49442" filter="url(#glowS)"/>
  <text class="small" x="760" y="247">Ship</text>
  <text class="small" x="740" y="278">unmapped</text>

  <!-- The overlay edges -->
  <path class="edgeH" d="M 180 143 C 380 143, 540 143, 740 143"/>
  <path class="edge" d="M 180 243 C 380 243, 540 243, 740 143"/>
  <text class="small accent" x="420" y="128">Produce ⇒ MakeGood</text>
  <text class="small accent" x="400" y="215">multi-target: one IMP ⇒ two REF</text>

  <!-- The legend -->
  <rect class="pane" x="30" y="470" width="900" height="60"/>
  <text class="label" x="46" y="494">the coverage legend:</text>
  <circle cx="180" cy="498" r="6" fill="#7a9e5e"/><text class="small" x="194" y="502">full</text>
  <circle cx="250" cy="498" r="6" fill="#2f7d6b"/><text class="small" x="264" y="502">minimal</text>
  <circle cx="340" cy="498" r="6" fill="#d49442"/><text class="small" x="354" y="502">partial</text>
  <circle cx="420" cy="498" r="6" fill="#8a8f98"/><text class="small" x="434" y="502">none</text>
  <circle cx="510" cy="498" r="6" fill="none" stroke="#b85555" stroke-width="2"/><text class="small" x="524" y="502">asserted ≠ computed (C23)</text>
  <text class="small" x="46" y="520">the numbers are always the kernel's computeCoverage — the Studio never reimplements the calculus.</text>
</svg>
