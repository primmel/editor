<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="monospace">
  <!-- The Studio workspace layout: topbar + three panels + the right-panel tabs -->
  <defs>
    <style>
      .panel { fill: #252019; stroke: #3a322a; stroke-width: 1.5; rx: 8; }
      .title { fill: #e9e0d2; font-size: 15px; font-weight: bold; }
      .label { fill: #8a8f98; font-size: 11px; }
      .small { fill: #8a8f98; font-size: 10px; }
      .accent { fill: #d49442; }
      .sage { fill: #7a9e5e; }
      .chip { fill: none; stroke-width: 1.2; rx: 4; }
      .tab { fill: #1c1814; stroke: #3a322a; stroke-width: 1; rx: 4; }
      .tabtext { fill: #c9c0b2; font-size: 10px; }
      .zone { fill: none; stroke: #524838; stroke-width: 1; stroke-dasharray: 5 4; rx: 6; }
    </style>
  </defs>
  <rect width="960" height="620" fill="#1c1814"/>

  <!-- The topbar -->
  <rect class="panel" x="16" y="14" width="928" height="54"/>
  <text class="title" x="32" y="46">Primmel Studio</text>
  <rect class="chip" x="200" y="26" width="58" height="30" stroke="#d49442"/>
  <text class="tabtext accent" x="214" y="45">Model</text>
  <rect class="chip" x="266" y="26" width="66" height="30" stroke="#524838"/>
  <text class="tabtext" x="276" y="45">Registry</text>
  <rect class="chip" x="340" y="26" width="64" height="30" stroke="#524838"/>
  <text class="tabtext" x="350" y="45">Mapping</text>
  <rect class="chip" x="412" y="26" width="44" height="30" stroke="#524838"/>
  <text class="tabtext" x="422" y="45">Diff</text>
  <rect class="chip" x="560" y="26" width="46" height="30" stroke="#524838"/>
  <text class="tabtext" x="570" y="45">New</text>
  <rect class="chip" x="614" y="26" width="50" height="30" stroke="#524838"/>
  <text class="tabtext" x="624" y="45">Save</text>
  <rect class="chip" x="672" y="26" width="60" height="30" stroke="#524838"/>
  <text class="tabtext" x="682" y="45">Import</text>
  <rect class="chip" x="800" y="26" width="128" height="30" stroke="#7a9e5e"/>
  <text class="tabtext sage" x="812" y="45">✓ valid · 3 processes</text>

  <!-- Left panel -->
  <rect class="panel" x="16" y="80" width="250" height="524"/>
  <text class="label accent" x="30" y="106">ELEMENTS (palette)</text>
  <rect class="zone" x="28" y="116" width="226" height="88"/>
  <text class="small" x="40" y="140">process · approval · dataclass</text>
  <text class="small" x="40" y="158">events · gateways · subprocess</text>
  <text class="small" x="40" y="176">+ the PROGRAM section (plugins)</text>
  <text class="label accent" x="30" y="236">PAGES</text>
  <rect class="zone" x="28" y="246" width="226" height="70"/>
  <text class="small" x="40" y="270">Root</text>
  <text class="small" x="52" y="288">└ Page1 · Page2 · unlinked…</text>
  <text class="label accent" x="30" y="348">TREE / CODE</text>
  <rect class="zone" x="28" y="358" width="226" height="230"/>
  <text class="small" x="40" y="382">every element by kind —</text>
  <text class="small" x="40" y="400">roles, processes, approvals,</text>
  <text class="small" x="40" y="418">provisions, events, gateways,</text>
  <text class="small" x="40" y="436">data classes, registries, enums,</text>
  <text class="small" x="40" y="454">variables, notes, comments</text>
  <text class="small" x="40" y="478">or the Monaco code view</text>
  <text class="small" x="40" y="496">(completion + markers)</text>

  <!-- Center: the canvas -->
  <rect class="panel" x="278" y="80" width="424" height="524"/>
  <text class="label accent" x="292" y="106">THE CANVAS (the diagram)</text>
  <rect class="zone" x="290" y="116" width="400" height="420"/>
  <circle cx="380" cy="200" r="18" fill="none" stroke="#7a9e5e" stroke-width="2"/>
  <text class="small" x="364" y="204">start</text>
  <rect x="440" y="176" width="90" height="48" rx="8" fill="none" stroke="#d49442" stroke-width="2"/>
  <text class="small" x="452" y="204">process</text>
  <path d="M 398 200 C 415 200 420 200 440 200" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="470" y="280" width="26" height="26" fill="none" stroke="#c47550" stroke-width="2" transform="rotate(45 483 293)"/>
  <path d="M 485 224 L 483 267" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="380" y="330" width="80" height="44" rx="8" fill="none" stroke="#d49442" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="small" x="390" y="356">dataclass</text>
  <text class="small" x="300" y="520">drag nodes · shift+drag to connect · dbl-click to enter a page</text>
  <text class="small" x="300" y="538">tabs + breadcrumbs navigate the page tree</text>

  <!-- Right panel -->
  <rect class="panel" x="714" y="80" width="230" height="524"/>
  <rect class="tab" x="726" y="92" width="48" height="22"/>
  <text class="tabtext" x="732" y="107">Inspect</text>
  <rect class="tab" x="778" y="92" width="66" height="22"/>
  <text class="tabtext" x="782" y="107">Compliance</text>
  <rect class="tab" x="848" y="92" width="54" height="22"/>
  <text class="tabtext" x="854" y="107">Simulate</text>
  <rect class="tab" x="906" y="92" width="34" height="22" stroke="#d49442"/>
  <text class="tabtext accent" x="910" y="107">Valid</text>
  <rect class="zone" x="726" y="124" width="206" height="190"/>
  <text class="small" x="738" y="146">the inspector — every facet</text>
  <text class="small" x="738" y="164">of the selected element,</text>
  <text class="small" x="738" y="182">each edit a command</text>
  <rect class="zone" x="726" y="322" width="206" height="130"/>
  <text class="small" x="738" y="344">comments (the thread +</text>
  <text class="small" x="738" y="362">the canvas badge)</text>
  <rect class="zone" x="726" y="460" width="206" height="130"/>
  <text class="small" x="738" y="482">measurements — run values,</text>
  <text class="small" x="738" y="500">verdicts, the result preview</text>
</svg>
