name: Release

# Publishes the package to npm on a version tag (`v*`) via npm trusted
# publishing (GitHub Actions OIDC), the same machinery as primmel-ts and
# oiml-pubid. No npm token is stored anywhere: the runner exchanges its
# OIDC identity for a short-lived publish credential, and the publish
# carries a provenance attestation bound to this repository and this
# workflow file.
#
# The publish step runs ONLY once the package is registered on npm (the
# one-time manual first publish + the trusted-publisher enrollment on
# npmjs.com; runbook: docs/deployment/npm-releases.md in the smart
# repo). Until then the job builds and tests the tag, prints the note,
# and skips the publish instead of failing red.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      registered: ${{ steps.gate.outputs.registered }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION."
            exit 1
          fi
      - run: npm run build
      - run: npm test
      - name: Check the package is registered on npm
        id: gate
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME" version > /dev/null 2>&1; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Note the pending first publish
        if: steps.gate.outputs.registered == 'false'
        run: |
          NAME="$(node -p "require('./package.json').name")"
          echo "::notice::$NAME is not on the npm registry yet, the publish is skipped."
          echo "Do the one-time manual publish and enroll the trusted publisher"
          echo "(docs/deployment/npm-releases.md in the smart repo), then re-run this job."
      - name: Publish with provenance
        if: steps.gate.outputs.registered == 'true'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub release
    needs: publish
    if: needs.publish.outputs.registered == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
